name: Release T3 Voice and T3 Code

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    name: Build T3 Voice Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # checkout's credential cleanup fails on orphaned .repos gitlinks.
      - name: Checkout T3 Voice
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git sparse-checkout set --cone apps/voice-windows
          git checkout --detach FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test T3 Voice
        run: dotnet run --project apps/voice-windows/T3.Voice.Tests --configuration Release

      - name: Publish T3 Voice
        run: ./apps/voice-windows/Publish.ps1

      - name: Package T3 Voice
        run: |
          foreach ($name in @('T3.Voice.exe', 'T3.Voice.pri', 'coreclr.dll', 'Microsoft.UI.Xaml.dll')) {
            if (!(Test-Path -LiteralPath "release/T3-Voice/$name" -PathType Leaf)) {
              throw "Missing published file: $name"
            }
          }
          $archive = 'release/T3-Voice-win-x64.zip'
          Compress-Archive -Path release/T3-Voice -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  T3-Voice-win-x64.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: T3-Voice-win-x64
          path: |
            release/T3-Voice-win-x64.zip
            release/T3-Voice-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

  host:
    name: Build T3 Code terminal host Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout T3 Code
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache resource monitor
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target
          key: voice-release-resource-monitor-windows-x64-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Enable T3 Connect public configuration
        run: Copy-Item -LiteralPath .env.example -Destination .env

      - name: Resolve host version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            $version = "0.0.0-preview.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $manifest = Get-Content apps/server/package.json -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 20 | Set-Content apps/server/package.json -Encoding utf8

      - name: Test terminal archive packaging
        run: vp test run scripts/build-cli-archive.test.ts

      - name: Bundle verified relay client
        run: node scripts/stage-windows-relay-client.ts

      - name: Build resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'The resource monitor could not be built.' }
          New-Item -ItemType Directory -Force apps/server/dist/resource-monitor | Out-Null
          Copy-Item native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe apps/server/dist/resource-monitor/

      - name: Build terminal executable
        run: vp run build:exe --verbose

      - name: Package terminal host
        run: |
          node scripts/build-cli-archive.ts --platform win --arch x64 --version '${{ steps.version.outputs.version }}' --output-dir release/t3-code --relay-client-dir apps/server/resources/relay-client
          if ($LASTEXITCODE -ne 0) { throw 'The terminal host archive could not be built.' }

      - name: Verify terminal archive
        run: |
          $archive = Get-Item 'release/t3-code/t3-${{ steps.version.outputs.version }}-win32-x64.zip'
          node scripts/smoke-cli-archive.ts --archive $archive.FullName --expect-version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'The terminal host archive could not start.' }
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath "$($archive.FullName).sha256" -Encoding utf8

      - name: Upload terminal archive
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-win-x64-terminal
          path: |
            release/t3-code/*.zip
            release/t3-code/*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Windows release
    needs: [voice, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download T3 Voice
        uses: actions/download-artifact@v8
        with:
          name: T3-Voice-win-x64
          path: release

      - name: Download T3 Code
        uses: actions/download-artifact@v8
        with:
          name: T3-Code-win-x64-terminal
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: T3 Voice and T3 Code ${{ github.ref_name }}
          make_latest: true
          body: |
            T3 Voice for Windows 11 x64.

            下载并完整解压 `T3-Voice-win-x64.zip`，运行其中的 `T3-Voice/T3.Voice.exe`。
            包含 .NET 和 Windows App SDK 运行文件。

            T3 Code Windows x64 终端版为 `t3-*-win32-x64.zip`。
            完整解压后运行 `t3.exe`，按终端提示登录，复制连接链接到 T3 Voice。
            已内置 Node 和 T3 Connect relay client，无需安装 Electron 或浏览器界面。

            本版仅保留 OpenCode、Codex、Claude Code，删除其他 provider 和本地前端。
            首次启动提示 T3 Connect 登录，后续启动复用授权；连接就绪后显示 HTTPS 地址。
            保持终端运行；按 Ctrl+C 停止。首次在 T3 Voice 添加机器时，使用同一个 T3 Connect 账号完成授权。
          files: |
            release/T3-Voice-win-x64.zip
            release/T3-Voice-win-x64.zip.sha256
            release/t3-*-win32-x64.zip
            release/t3-*-win32-x64.zip.sha256
          fail_on_unmatched_files: true
