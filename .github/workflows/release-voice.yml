name: Release T3 Voice and T3 Code

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    name: Build T3 Voice Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # checkout's credential cleanup fails on orphaned .repos gitlinks.
      - name: Checkout T3 Voice
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git sparse-checkout set --cone apps/voice-windows
          git checkout --detach FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test T3 Voice
        run: dotnet run --project apps/voice-windows/T3.Voice.Tests --configuration Release

      - name: Publish T3 Voice
        run: ./apps/voice-windows/Publish.ps1

      - name: Package T3 Voice
        run: |
          foreach ($name in @('T3.Voice.exe', 'T3.Voice.pri', 'coreclr.dll', 'Microsoft.UI.Xaml.dll')) {
            if (!(Test-Path -LiteralPath "release/T3-Voice/$name" -PathType Leaf)) {
              throw "Missing published file: $name"
            }
          }
          $archive = 'release/T3-Voice-win-x64.zip'
          Compress-Archive -Path release/T3-Voice -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  T3-Voice-win-x64.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: T3-Voice-win-x64
          path: |
            release/T3-Voice-win-x64.zip
            release/T3-Voice-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

  desktop:
    name: Build T3 Code Windows x64 portable
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      # checkout's credential cleanup fails on orphaned .repos gitlinks.
      - name: Checkout T3 Code
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache resource monitor
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target
          key: voice-release-resource-monitor-windows-x64-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Enable T3 Connect public configuration
        run: Copy-Item -LiteralPath .env.example -Destination .env

      - name: Resolve desktop version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            $version = "0.0.0-preview.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Electron runtime
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs

      - name: Test desktop startup configuration
        working-directory: apps/desktop
        run: vp test run src/backend/DesktopBackendConfiguration.test.ts

      - name: Test desktop packaging
        working-directory: scripts
        run: vp test run --config ../vite.config.ts build-desktop-artifact.test.ts -t 'omits update feeds'

      - name: Bundle verified relay client
        run: node scripts/stage-windows-relay-client.ts

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build portable EXE
        env:
          T3CODE_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: vp run dist:desktop:artifact --platform win --target portable --arch x64 --output-dir release/t3-code --verbose

      - name: Verify relay client and packaged startup
        run: |
          $appDirectory = 'release/t3-code/win-unpacked'
          $relayClient = Join-Path $appDirectory 'resources/relay-client/cloudflared.exe'
          & $relayClient version
          if ($LASTEXITCODE -ne 0) { throw 'The bundled relay client could not start.' }
          $expected = (Get-FileHash -LiteralPath apps/desktop/resources/relay-client/cloudflared.exe -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $relayClient -Algorithm SHA256).Hash -ne $expected) {
            throw 'The packaged relay client checksum changed.'
          }
          $executable = @(Get-ChildItem -LiteralPath $appDirectory -Filter 'T3 Code*.exe')
          if ($executable.Count -ne 1) { throw 'Expected one packaged T3 Code executable.' }
          $appExecutable = $executable[0].FullName
          node scripts/smoke-desktop-app.ts --executable $appExecutable --artifacts-dir release/t3-code/launch-check
          if ($LASTEXITCODE -ne 0) { throw 'The packaged T3 Code application could not start.' }

      - name: Checksum portable EXE
        run: |
          $archives = @(Get-ChildItem -LiteralPath release/t3-code -Filter '*-portable.exe')
          if ($archives.Count -ne 1) { throw 'Expected one portable EXE.' }
          $archive = $archives[0]
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath "$($archive.FullName).sha256" -Encoding utf8

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-win-x64-portable
          path: |
            release/t3-code/*-portable.exe
            release/t3-code/*-portable.exe.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload startup failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-startup-failure
          path: release/t3-code/launch-check
          if-no-files-found: ignore

  release:
    name: Publish Windows release
    needs: [voice, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download T3 Voice
        uses: actions/download-artifact@v8
        with:
          name: T3-Voice-win-x64
          path: release

      - name: Download T3 Code
        uses: actions/download-artifact@v8
        with:
          name: T3-Code-win-x64-portable
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: T3 Voice and T3 Code ${{ github.ref_name }}
          body: |
            T3 Voice for Windows 11 x64.

            下载并完整解压 `T3-Voice-win-x64.zip`，运行其中的 `T3-Voice/T3.Voice.exe`。
            包含 .NET 和 Windows App SDK 运行文件。

            T3 Code Windows x64 便携版为 `T3-Code-*-x64-portable.exe`。
            双击即可运行，已内置 T3 Connect relay client，无需首次下载 cloudflared。
          files: |
            release/T3-Voice-win-x64.zip
            release/T3-Voice-win-x64.zip.sha256
            release/T3-Code-*-x64-portable.exe
            release/T3-Code-*-x64-portable.exe.sha256
          fail_on_unmatched_files: true
